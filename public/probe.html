<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>TMS Probe</title></head>
<body>
<div id="probe" style="padding:16px;font:14px/1.5 sans-serif">TMS PROBE: HTML dimuat, menunggu initialize...</div>
<script>
(function () {
  console.info('[TMS-PROBE] script jalan');
  window.geotab = window.geotab || {};
  window.geotab.addin = window.geotab.addin || {};
  var factory = function () {
    return {
      initialize: function (api, state, cb) {
        var el = document.getElementById('probe');
        if (el) el.textContent = 'TMS PROBE OK: initialize dipanggil.';
        console.info('[TMS-PROBE] initialize dipanggil');
        cb();
      },
      focus: function () {},
      blur: function () {}
    };
  };
  ['probe', 'tmsProbe', 'TMSProbe'].forEach(function (n) { window.geotab.addin[n] = factory; });
})();
</script>
</body>
</html>
